name: Discover and fork DeepSeek Harness projects

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only search and report; do not fork, sync, or edit README"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deepseek-harness-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORK_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search, fork, sync, and update catalog
        env:
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          MAX_NEW_FORKS: 20
          MAX_SEARCH_RESULTS: 100
        run: node scripts/discover-and-fork.mjs

      - name: Create or update catalog PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FORK_TOKEN }}
          branch: automation/deepseek-harness-discovery
          base: main
          delete-branch: true
          title: "chore: discover DeepSeek Harness projects"
          commit-message: "chore: discover DeepSeek Harness projects"
          body: |
            This PR was generated by the scheduled DeepSeek Harness discovery workflow.

            It searches GitHub for `dsh-plugin` and `deepseek-harness`, creates missing forks under `xianyu110`, syncs catalog forks from upstream, and updates the generated README section.
