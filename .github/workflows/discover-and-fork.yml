name: Discover DeepSeek Harness projects

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only search and report; do not edit README"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deepseek-harness-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search and update catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          MAX_NEW_ENTRIES: 5
          MAX_SEARCH_RESULTS: 100
        run: node scripts/discover-and-fork.mjs

      - name: Create or update catalog PR
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/deepseek-harness-discovery
          base: main
          delete-branch: true
          title: "chore: discover DeepSeek Harness projects"
          commit-message: "chore: discover DeepSeek Harness projects"
          body: |
            This PR was generated by the manually triggered DeepSeek Harness discovery workflow.

            It searches GitHub for `dsh-plugin` and `deepseek-harness`, links the repos it finds directly to this README, and updates the generated section.

      - name: Enable automatic PR merge
        if: ${{ steps.create_pr.outputs.pull-request-number != '' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
